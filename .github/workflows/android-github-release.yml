# centralized-by: HereLiesAz/workflows
# central-source-path: .github/workflows/android-github-release.yml
# central-source-sha256: 406ccaf4c0bda72c474888723e92296231db69a7f0b58052336064fa6295d417
# This file intentionally contains no repository secrets.
# central-run-tracker: HereLiesAz/workflows
name: Android GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub Release as a pre-release
        type: boolean
        default: false
permissions: {}
jobs:
  central:
    name: Hand-off
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Point to central result
        env:
          STATUS_CONTEXT: .github/workflows/android-github-release.yml
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Release builds execute in HereLiesAz/workflows via the registered webhook.
          # The central executor sets this source commit's status pending, then success/failure.
          # This tracker does not dispatch or poll; it exits without claiming the build passed.
          {
            echo "### Runs in HereLiesAz/workflows"
            echo
            echo "Result: commit status `$STATUS_CONTEXT` on `$TARGET_SHA`."
            echo "Central runs: $GITHUB_SERVER_URL/HereLiesAz/workflows/actions"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Result is reported as commit status '$STATUS_CONTEXT' on $TARGET_SHA."
