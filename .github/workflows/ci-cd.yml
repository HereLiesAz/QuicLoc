name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Build Release APK
        run: ./gradlew assembleRelease
        # Assuming you have set up signing or this is an unsigned release build
      - name: Build Release Bundle (AAB)
        run: ./gradlew bundleRelease
        # Unsigned in PR CI (no keystore secrets — the signing config only
        # attaches when keystore material is present). This exercises
        # :app:packageReleaseBundle / bundletool, so dynamic-feature
        # bundle-merge conflicts (e.g. clashing META-INF/*.version metadata
        # between :app and :feature_findmyphone) are caught here instead of
        # only surfacing later in the Release to Play workflow.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/
          
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: apks
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/debug/*.apk
            **/release/*.apk
