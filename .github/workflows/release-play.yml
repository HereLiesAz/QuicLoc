name: Release to Play

# Manual, signed Android App Bundle build + (optional) Google Play upload.
# Defaults are deliberately safe: builds the .aab and uploads it as a workflow
# artifact, and only pushes to Play when `publish` is explicitly enabled, to the
# internal track, as a draft.
#
# Required repo secrets (see docs/PLAY_PUBLISHING.md):
#   UPLOAD_KEYSTORE_BASE64     - base64 of the upload keystore (.jks)
#   UPLOAD_KEYSTORE_PASSWORD   - keystore password
#   UPLOAD_KEY_ALIAS           - key alias
#   UPLOAD_KEY_PASSWORD        - key password
#   PLAY_SERVICE_ACCOUNT_JSON  - Google Play service-account JSON (publish only)

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "Release status"
        type: choice
        options: [draft, completed]
        default: draft
      publish:
        description: "Publish to Play (off = build + upload the .aab artifact only)"
        type: boolean
        default: false

jobs:
  build-publish:
    name: Build signed AAB${{ inputs.publish && ' + publish' || '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so versionCode = commit count is correct

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Compute versionCode from commit count
        run: echo "VERSION_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Read application id
        run: echo "APP_ID=$(./gradlew -q :app:printApplicationId)" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        env:
          QUICLOC_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          QUICLOC_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          QUICLOC_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          QUICLOC_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PversionBuild=${{ env.VERSION_BUILD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicloc-release-aab-${{ env.VERSION_BUILD }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish to Google Play
        if: ${{ inputs.publish }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.APP_ID }}
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
