name: R8 mapping triage export

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/r8-triage-export.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  export:
    name: Locate exact mapping and deobfuscate crash symbols
    runs-on: ubuntu-latest
    env:
      TARGET_MAP_ID: e1d9e9c5088656e57dfae6fdbc10391819fc8a1d7e0ee04ab009f9a8953cc9de
    steps:
      - name: Find exact R8 mapping
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidates"
          found=""
          source_run_id=""

          mapfile -t run_ids < <(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release-play.yml \
            --status success \
            --limit 100 \
            --json databaseId \
            --jq '.[].databaseId')

          for run_id in "${run_ids[@]}"; do
            rm -rf "$RUNNER_TEMP/candidates"/*
            if ! gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'quicloc-mapping-*' \
              --dir "$RUNNER_TEMP/candidates" >/dev/null 2>&1; then
              continue
            fi

            while IFS= read -r map; do
              map_id=$(grep -m1 '^# pg_map_id:' "$map" | sed -E 's/^# pg_map_id:[[:space:]]*//' || true)
              echo "run=$run_id map_id=${map_id:-none}"
              if [ "$map_id" = "$TARGET_MAP_ID" ]; then
                cp "$map" "$RUNNER_TEMP/target-mapping.txt"
                source_run_id="$run_id"
                found=1
                break 2
              fi
            done < <(find "$RUNNER_TEMP/candidates" -type f -name mapping.txt -print)
          done

          if [ -z "$found" ]; then
            echo "::error::Exact map id $TARGET_MAP_ID not found in the last 100 successful Release to Play runs."
            exit 1
          fi

          echo "MAP_PATH=$RUNNER_TEMP/target-mapping.txt" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$source_run_id" >> "$GITHUB_ENV"
          echo "Found exact map in run $source_run_id"

      - name: Emit deobfuscation targets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re

          path = os.environ['MAP_PATH']
          out_path = os.path.join(os.environ['RUNNER_TEMP'], 'deobfuscation.txt')
          targets = {'cg2', 'qb2', 'id0', 'pl'}
          with open(path, encoding='utf-8') as f:
              lines = f.read().splitlines()

          output = []
          for line in lines:
              if line.startswith('# pg_map_id:'):
                  output.append(line)
                  break
          output.append(f"source_run_id={os.environ['SOURCE_RUN_ID']}")

          headers = []
          rx = re.compile(r'^(\S.*) -> ([^:]+):$')
          for i, line in enumerate(lines):
              m = rx.match(line)
              if m:
                  headers.append((i, m.group(1), m.group(2)))

          found = set()
          for n, (start, original, obfuscated) in enumerate(headers):
              if obfuscated not in targets:
                  continue
              end = headers[n + 1][0] if n + 1 < len(headers) else len(lines)
              found.add(obfuscated)
              output.append(f'R8_TARGET_{obfuscated}_BEGIN')
              output.extend(lines[start:end])
              output.append(f'R8_TARGET_{obfuscated}_END')

          missing = sorted(targets - found)
          output.append('R8_TARGETS_MISSING=' + ','.join(missing))
          text = '\n'.join(output) + '\n'
          print(text, end='')
          with open(out_path, 'w', encoding='utf-8') as f:
              f.write(text)
          PY

      - name: Upload exact mapping and symbol report
        uses: actions/upload-artifact@v4
        with:
          name: r8-triage-${{ env.TARGET_MAP_ID }}
          path: |
            ${{ env.MAP_PATH }}
            ${{ runner.temp }}/deobfuscation.txt
          if-no-files-found: error
          retention-days: 7
