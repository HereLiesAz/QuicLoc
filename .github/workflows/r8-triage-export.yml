name: R8 mapping triage export

# Temporary diagnostic bridge. The release workflow keeps mapping.txt as a
# private Actions artifact; this workflow makes that artifact readable through
# Actions logs without committing the deobfuscation map into Git history.
# Remove this workflow after the current crash is diagnosed.

on:
  # Creating/updating this file kicks the bridge once immediately, so it can
  # recover the newest successful Release-to-Play mapping that still exists.
  push:
    branches: [main]
    paths:
      - .github/workflows/r8-triage-export.yml

  # Future Play builds are exported automatically while this bridge exists.
  workflow_run:
    workflows: ["Release to Play"]
    types: [completed]

  # Also allows a specific historical run to be selected from the Actions UI.
  workflow_dispatch:
    inputs:
      run_id:
        description: "Release to Play run ID (blank = newest successful run)"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  export:
    name: Emit mapping.txt into readable logs
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          run_id=""
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            run_id="$WORKFLOW_RUN_ID"
          elif [ -n "${REQUESTED_RUN_ID:-}" ]; then
            run_id="$REQUESTED_RUN_ID"
          else
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release-play.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful Release to Play run was found."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Source Release to Play run: $run_id"

      - name: Download R8 mapping artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r8"
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'quicloc-mapping-*' \
            --dir "$RUNNER_TEMP/r8"

          map=$(find "$RUNNER_TEMP/r8" -type f -name mapping.txt -print -quit)
          if [ -z "$map" ]; then
            echo "::error::The selected run has no mapping.txt artifact."
            find "$RUNNER_TEMP/r8" -maxdepth 4 -type f -print || true
            exit 1
          fi

          echo "MAP_PATH=$map" >> "$GITHUB_ENV"
          echo "Found mapping: $map"
          grep -m1 '^# pg_map_id:' "$map" || true

      - name: Emit compressed mapping for ChatGPT triage
        run: |
          set -euo pipefail
          echo 'R8_MAPPING_GZIP_BASE64_BEGIN'
          gzip -9c "$MAP_PATH" | base64 -w 120
          echo
          echo 'R8_MAPPING_GZIP_BASE64_END'
