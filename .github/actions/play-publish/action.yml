name: "play-publish"
description: "Publish AAB to Google Play (composite action using google-github-actions/upload-google-play)"
inputs:
  service_account_json:
    description: "Service account JSON (full text)"
    required: true
  aab_path:
    description: "Path to built .aab (glob allowed)"
    required: true
  track:
    description: "Release track (production, beta, internal)"
    required: true
    default: "internal"
  package_name:
    description: "Application package name (optional). If omitted the uploader will try to detect it from the AAB."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare service account
      shell: bash
      run: |
        set -euo pipefail
        sa="$RUNNER_TEMP/sa.json"
        umask 077
        printf '%s' "${{ inputs.service_account_json }}" > "$sa"
        if ! jq -e . "$sa" >/dev/null 2>&1; then
          echo "::error::Service account JSON is not valid JSON."
          exit 1
        fi

    - name: Upload to Google Play
      uses: google-github-actions/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: "${{ inputs.service_account_json }}"
        releaseFiles: "${{ inputs.aab_path }}"
        track: "${{ inputs.track }}"
        packageName: "${{ inputs.package_name }}"
